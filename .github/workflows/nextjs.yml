name: Check Next.js and Payload

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: ci-only-secret-for-an-isolated-disposable-database
      DATABASE_URL: file:./data/ci.db
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run cms:migrate
      - run: npm run cms:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cms
      - run: npm run build
